# Holt die Daten, baut die Seite und veroeffentlicht sie auf GitHub Pages.
#
# Es laeuft alles hier, auf GitHubs Rechnern. Weder der Mac noch ein Homeserver muss an
# sein. Fuer oeffentliche Repos sind die Actionminuten unbegrenzt.
#
# Was NICHT im Repo liegt und deshalb im Zwischenspeicher gehalten wird:
#   public/tage   die Tagesdateien, sonst muesste jeder Lauf dreissig Tage neu holen
#   public/img    rund 2200 Kartenbilder, die einmalig von der Kartenseite kommen
#   ~/.opbounty_replays   die Rohlogs der Replays, sie aendern sich nie
#
# Was der Lauf selbst erzeugt und was deshalb NICHT im Repo liegt: die Spielerdaten
# und die eingedampften Replays. Beides sind Daten fremder Spieler; ein oeffentliches
# Repo soll sie nicht tragen, auch nicht verschluesselt.
#
# Die Bestenliste holt seit dem 25.09.2026 NICHT dieser Lauf, sondern der Bazzite: der
# echte Spielclient ruft sie ab, ein Mitschnitt zeichnet sie auf, und der Server pusht
# die verschluesselte Datei (mitschnitt_server.sh, mitschnitt.timer). Der Push loest
# diesen Lauf aus. Der eigene Laeufer, der das hier bis dahin tat, bekommt seit dem
# Clientupdate 2.6.1 keine Antwort mehr, siehe specs/features/bestenliste.md.
# Faellt der Zwischenspeicher aus, holt der naechste Lauf alles neu. Das heilt sich also
# selbst, es dauert nur laenger.
#
# VERSCHLUESSELT WIRD NACH dem Bau, in dist. Wuerde public verschluesselt, laege im
# Zwischenspeicher unbrauchbarer Geheimtext und der naechste Lauf muesste alles neu holen.

name: Veroeffentlichen

on:
  schedule:
    - cron: "20 6 * * *"
  push:
    branches: [main]
    # Ein Doku-Commit soll keinen kompletten Neubau ausloesen: der holt alle Daten,
    # baut und veroeffentlicht, und aendert an der Seite nichts.
    paths-ignore:
      - "**/*.md"
      - "specs/**"
      - "docs/**"
      - ".gitignore"
  workflow_dispatch:

permissions:
  # Schreiben, weil der Lauf nachgezogene Spielversionen zurueck ins Repo legt.
  # Pushes mit dem GITHUB_TOKEN loesen keinen neuen Lauf aus, also keine Schleife.
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    # Damit die Wache am Ende sagen kann, WARUM die Liste fehlt.
    outputs:
      spielversion: ${{ steps.spielversion.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Zwischenspeicher fuer Daten und Bilder
        uses: actions/cache@v4
        with:
          path: |
            public/tage
            public/img
          key: daten-${{ github.run_id }}
          restore-keys: daten-

      - run: pip install --quiet cryptography pillow

      - name: Daten und Bilder holen
        run: |
          python3 aktualisieren.py \
            --ziel public \
            --tage 30 \
            --bounty 25_1000,1000_2000,2000_3000,3000 \
            --bilder

      # Die Rohlogs der Replays aendern sich nie. Ohne Zwischenspeicher zoege jeder
      # Lauf dreihundert Dateien neu vom Storage.
      - name: Zwischenspeicher fuer Replaylogs
        uses: actions/cache@v4
        with:
          path: ~/.opbounty_replays
          key: replays-${{ github.run_id }}
          restore-keys: replays-

      # Die Werkzeuge des eigenen Laeufers bleiben aktuell, auch wenn er hier nicht
      # mehr laeuft: faengt er eines Tages wieder an zu antworten, passen die Nummern.
      # Der Spielserver nennt seine Version gleich nach dem Verbinden, ohne Anmeldung.
      # Stimmt sie nicht mehr mit der im Code, haben sich die Methodennummern und die
      # Pruefsumme verschoben und die Beschaffung laeuft ins Leere.
      #
      # Das repariert sich hier selbst: der Client laedt sein Paket von einer
      # oeffentlichen Adresse, die im Paket selbst steht, und die Nummern sind daraus
      # herleitbar. Es braucht also keinen Spielclient und niemanden, der ihn startet.
      # Die 40 MB werden nur geladen, wenn die Versionen wirklich auseinanderlaufen.
      - name: Spielversion pruefen und noetigenfalls nachziehen
        id: spielversion
        run: |
          set -uo pipefail
          if python3 werkzeuge/version_nachziehen.py --nur-server; then
            exit 0
          fi
          echo "  Neue Spielversion, ziehe die Nummern nach"
          python3 werkzeuge/version_nachziehen.py --laden --schreiben || exit 1
          git add -A werkzeuge/
          if git diff --cached --quiet; then
            echo "  Der Server meldet eine andere Version, aber im Paket hat sich"
            echo "  nichts geaendert. Das gehoert angesehen."
            exit 1
          fi
          git -c user.name="ladder" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Spielversion nachgezogen, $(date +%F)"
          git push -q origin HEAD:main
          echo "  nachgezogen und gepusht, der naechste Schritt nutzt die neuen Nummern"
        continue-on-error: true

      # Die Spielerdaten lesen die user_ids aus der Bestenliste, die der Bazzite ins
      # Repo gelegt hat. Die liegt nur verschluesselt vor, deshalb braucht auch dieser Schritt das
      # Seitenpasswort.
      - name: Spielerdaten holen
        env:
          OPBOUNTY_API_KEY: ${{ secrets.OPBOUNTY_API_KEY }}
          OPBOUNTY_PROJECT: ${{ secrets.OPBOUNTY_PROJECT }}
          OPBOUNTY_BUCKET: ${{ secrets.OPBOUNTY_BUCKET }}
          OPBOUNTY_EMAIL: ${{ secrets.OPBOUNTY_EMAIL }}
          OPBOUNTY_PASSWORT: ${{ secrets.OPBOUNTY_PASSWORT }}
          SEITEN_PASSWORT: ${{ secrets.SEITEN_PASSWORT }}
        run: python3 spieler_daten.py
        # Ein Ausfall bei Firestore darf nicht die ganze Seite kosten. Die Anzeige
        # kommt ohne diese Daten aus, der Spielerreiter meldet dann, dass nichts da
        # ist. Lieber eine Seite ohne Spielerdaten als gar keine.
        continue-on-error: true

      - name: Replays holen
        run: python3 replays_holen.py
        continue-on-error: true

      - run: npm ci
      - run: npm run build

      # GitHub Pages liefert bei unbekannten Pfaden 404.html aus. Ist das eine Kopie
      # der Startseite, laedt /matrix und /rankings auch beim direkten Aufruf und die
      # Anwendung uebernimmt von dort.
      - name: Adressen wie /matrix beim Direktaufruf ermoeglichen
        run: cp dist/index.html dist/404.html

      - name: Daten verschluesseln
        env:
          SEITEN_PASSWORT: ${{ secrets.SEITEN_PASSWORT }}
        run: python3 verschluesseln.py --ziel dist

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4

  # Die Wache meldet, was sonst niemand meldet.
  #
  # Die Bestenliste kommt vom Bazzite. Faellt er aus, erscheint die Seite trotzdem,
  # nur mit alten Zahlen, und genau das faellt sonst niemandem auf: vom 09.09. bis zum
  # 21.09.2026 blieb die Liste dreizehn Tage stehen, ohne dass es jemand merkte.
  #
  # Dieser Job laeuft NACH dem Veroeffentlichen und haengt nichts davon ab. Er kann
  # die Seite also nicht verhindern, sondern nur den Lauf rot faerben, und genau das
  # soll er. Rot heisst Mail.
  wache:
    needs: [bauen, veroeffentlichen]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Ist die Bestenliste noch frisch?
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.bauen.outputs.spielversion }}
        run: |
          set -euo pipefail
          DATEI="public/bestenliste.json.gz.enc"
          # Der Bazzite pusht taeglich um 05:30 UTC, das Nachfassen um 06:30. 30 Stunden
          # heisst: ein ausgefallener Tag faellt am selben Tag auf, sobald der geplante
          # Lauf ihn sieht, aber ein Lauf zwischen den beiden Terminen meldet noch nichts.
          MAX_STUNDEN=30

          # Gefragt ist nicht, ob etwas lief, sondern ob die Datei frisch ist.
          STAND=$(gh api "repos/${GITHUB_REPOSITORY}/commits?path=${DATEI}&per_page=1" \
                  --jq '.[0].commit.committer.date')
          if [ -z "${STAND}" ]; then
            echo "Kein Commit fuer ${DATEI} gefunden."
            exit 1
          fi
          STUNDEN=$(( ( $(date -u +%s) - $(date -u -d "${STAND}" +%s) ) / 3600 ))
          echo "Letzter Stand: ${STAND} (vor ${STUNDEN} Stunden)"

          {
            echo "## Bestenliste"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Letzter Stand | ${STAND} |"
            echo "| Alter | ${STUNDEN} Stunden |"
            echo "| Spielversion | ${VERSION} |"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ "${VERSION}" = "failure" ]; then
            echo ""
            echo "Die Spielversion laeuft auseinander und das Nachziehen hat NICHT"
            echo "funktioniert. Von Hand nachsehen:"
            echo "  python3 werkzeuge/version_nachziehen.py --laden"
            {
              echo ""
              echo "**Spielversion.** Das automatische Nachziehen ist fehlgeschlagen,"
              echo "siehe den Schritt \"Spielversion pruefen und noetigenfalls nachziehen\"."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

          if [ "${STUNDEN}" -gt "${MAX_STUNDEN}" ]; then
            echo ""
            echo "Die Bestenliste ist ${STUNDEN} Stunden alt, erlaubt sind ${MAX_STUNDEN}."
            echo "Die Seite ist trotzdem veroeffentlicht, sie zeigt nur alte Zahlen."
            echo "Der Mitschnitt auf dem Bazzite hat nicht gepusht. Dort nachsehen:"
            echo "  journalctl --user -u mitschnitt.service -n 50"
            echo "  letztes Foto in ~/mitschnitt/lauf/letztes_foto.png"
            {
              echo ""
              echo "**Veraltet.** Die Seite ist veroeffentlicht, zeigt aber alte Zahlen."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
